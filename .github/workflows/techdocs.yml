name: TechDocs Validation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'

jobs:
  validate-techdocs:
    name: Validate TechDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: |
          pip install mkdocs-techdocs-core

      - name: Validate mkdocs.yml
        run: |
          python -c "import yaml; yaml.safe_load(open('mkdocs.yml'))"
          echo "✅ mkdocs.yml is valid YAML"

      - name: Validate catalog-info.yaml
        run: |
          python -c "import yaml; yaml.safe_load(open('catalog-info.yaml'))"
          echo "✅ catalog-info.yaml is valid YAML"

      - name: Build TechDocs
        run: |
          mkdocs build --strict
          echo "✅ TechDocs build successful"

      - name: Check for broken links
        run: |
          python - <<'EOF'
          import re
          import sys
          from pathlib import Path

          docs_dir = Path('docs')
          errors = []

          for md_file in sorted(docs_dir.rglob('*.md')):
              content = md_file.read_text(encoding='utf-8')
              for match in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', content):
                  url = match.group(2).split('#')[0]
                  if not url or url.startswith('http') or url.startswith('mailto'):
                      continue
                  target = (md_file.parent / url).resolve()
                  if not target.exists():
                      errors.append(f"❌ Broken link in {md_file}: {url}")

          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)

          print("✅ No broken internal links found")
          EOF

      - name: Validate markdown
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint markdown files
        run: markdownlint-cli2 "docs/**/*.md"

      - name: Upload TechDocs site
        uses: actions/upload-artifact@v4
        with:
          name: techdocs-site
          path: site/
          retention-days: 7

      - name: TechDocs summary
        run: |
          echo "### TechDocs Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ MkDocs configuration valid" >> $GITHUB_STEP_SUMMARY
          echo "✅ Catalog metadata valid" >> $GITHUB_STEP_SUMMARY
          echo "✅ Documentation built successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ No broken links detected" >> $GITHUB_STEP_SUMMARY
          echo "✅ Markdown linting passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Documentation pages:" >> $GITHUB_STEP_SUMMARY
          find docs/ -name "*.md" | wc -l | xargs echo "- Total markdown files:" >> $GITHUB_STEP_SUMMARY
