site_name: Larios Income Tax Website
site_description: Angular-based web application for Larios Income Tax services
site_author: Larios Income Tax Team
repo_url: https://github.com/bit-and-byte-ideas/larios-income-tax-website
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Local Development: getting-started/development.md
      - Environment Configuration: getting-started/environment.md
  - Architecture:
      - Project Structure: architecture/project-structure.md
      - Internationalization (i18n): architecture/i18n.md
      - Module Structure: architecture/module-structure.md
  - Features:
      - Overview: features/index.md
      - Services Catalog: features/services.md
      - Theme System: features/themes.md
  - Guides:
      - Adding a Service: guides/adding-services.md
      - Adding Translations: guides/adding-translations.md
      - Production Build: guides/production-build.md
      - Code Quality: guides/code-quality.md
      - Pre-commit Setup: guides/pre-commit.md
      - CI/CD Pipeline: guides/ci-cd.md
      - Azure Deployment: guides/azure-deployment.md
      - Azure Infrastructure: guides/azure-infrastructure.md
      - Deployment Checklist: guides/azure-checklist.md
  - Project Information:
      - About This Project: project-info.md
  - Style Guides:
      - Markdown Style Guide: markdown-style-guide.md

theme:
  name: material
  palette:
    primary: brown
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite:
      linenums: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
  - techdocs-core

extra:
  version: 0.0.0
  project:
    name: Larios Income Tax Website
    type: website
    framework: Angular 21.0.4
    deployment: Azure Static Web Apps
