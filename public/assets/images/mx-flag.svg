<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 36">
  <!-- 3 vertical stripes: green, white, red -->
  <rect width="20" height="36" fill="#006847"/>
  <rect x="20" width="20" height="36" fill="#FFF"/>
  <rect x="40" width="20" height="36" fill="#CE1126"/>
  <!-- Simplified coat of arms: circle on white stripe -->
  <circle cx="30" cy="18" r="6" fill="#8B6914" opacity="0.3"/>
  <circle cx="30" cy="18" r="4.5" fill="#5C8A3C" opacity="0.6"/>
  <ellipse cx="30" cy="20" rx="3" ry="2" fill="#8B6914" opacity="0.4"/>
</svg>
